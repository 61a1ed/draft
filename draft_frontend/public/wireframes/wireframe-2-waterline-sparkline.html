<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wireframe 2 — Waterline Erosion Sparkline</title>
  <style>
    :root {
      --bg: #0f0e14;
      --panel: #16141a;
      --border: #2b2e43;
      --purple: #7761d9;
      --purple-light: #a693f5;
      --ink: #d5d7e1;
      --muted: #85889b;
      --mint: #5ec294;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--ink);
      padding: 24px 32px;
    }
    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }
    .top-nav a { color: var(--purple-light); text-decoration: none; font-weight: 600; }
    .sim-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      background: #1d1927;
      border: 1px solid #3d315b;
      padding: 12px 18px;
      border-radius: 10px;
      margin-bottom: 20px;
    }
    .sim-bar label { font-size: 13px; font-weight: 700; color: #dcd5f8; }
    .sim-bar input[type="range"] { flex: 1; accent-color: var(--purple); cursor: pointer; }
    .sim-pill {
      background: var(--purple);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      min-width: 140px;
      text-align: center;
    }
    /* Section Heading with Embedded Sparkline */
    .board-header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 20px;
      margin-bottom: 16px;
    }
    .title-block h2 { margin: 0 0 4px; font-size: 20px; }
    .title-block span { font-size: 12px; color: var(--muted); }
    .waterline-widget {
      display: flex;
      align-items: center;
      gap: 16px;
      background: #110f16;
      border: 1px solid #282338;
      border-radius: 10px;
      padding: 10px 16px;
    }
    .waterline-legend {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 11px;
      min-width: 155px;
    }
    .legend-item { display: flex; align-items: center; gap: 6px; color: var(--muted); }
    .swatch-initial { width: 14px; height: 2px; border-top: 2px dashed #696380; }
    .swatch-live { width: 14px; height: 8px; background: rgba(119, 97, 217, 0.55); border-top: 2px solid var(--purple-light); border-radius: 2px; }
    .swatch-avg { width: 8px; height: 8px; border-radius: 50%; background: var(--mint); }
    svg.waterline-svg {
      width: 340px;
      height: 58px;
      overflow: visible;
    }
    .board-preview {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
      opacity: 0.85;
    }
    .preview-col {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      font-size: 12px;
    }
    .preview-col strong { display: block; margin-bottom: 6px; color: var(--purple-light); }
    .bar-meter { height: 6px; background: #241f31; border-radius: 3px; overflow: hidden; margin-bottom: 6px; }
    .bar-meter > span { display: block; height: 100%; background: var(--purple); transition: width 0.2s; }
  </style>
</head>
<body>
  <div class="top-nav">
    <div><strong>Wireframe 2:</strong> "Waterline Erosion" Dual-Silhouette Sparkline (Financial / Weather Radar Style)</div>
    <a href="index.html">← Back to all 5 Wireframes</a>
  </div>

  <div class="sim-bar">
    <label for="draftSlider">Scrub Through the Draft:</label>
    <input id="draftSlider" type="range" min="0" max="90" value="35" />
    <span class="sim-pill" id="simLabel">Pick 28 / 80</span>
  </div>

  <div class="board-header-bar">
    <div class="title-block">
      <h2>Draft Board</h2>
      <span id="subStats">172 of 260 Pokémon remaining in pool</span>
    </div>

    <!-- COMPACT WATERLINE SPARKLINE WIDGET -->
    <div class="waterline-widget">
      <div class="waterline-legend">
        <strong style="color:#e2def2; font-size:12px;">Pool Erosion Curve</strong>
        <div class="legend-item"><span class="swatch-initial"></span> Initial Pool Roof (Round 1)</div>
        <div class="legend-item"><span class="swatch-live"></span> Current Remaining Waterline</div>
        <div class="legend-item"><span class="swatch-avg"></span> <span id="avgCostText">Avg Left: 8.4 pts</span></div>
      </div>
      <svg class="waterline-svg" id="sparkSvg" viewBox="0 0 340 58"></svg>
    </div>
  </div>

  <div class="board-preview" id="boardPreview"></div>

  <script>
    // Costs 20 down to 1
    const INITIAL_COUNTS = [
      { cost: 20, count: 5 }, { cost: 19, count: 6 }, { cost: 18, count: 8 }, { cost: 17, count: 12 },
      { cost: 16, count: 14 }, { cost: 15, count: 15 }, { cost: 14, count: 11 }, { cost: 13, count: 9 },
      { cost: 12, count: 16 }, { cost: 11, count: 13 }, { cost: 10, count: 12 }, { cost: 9, count: 10 },
      { cost: 8, count: 11 }, { cost: 7, count: 13 }, { cost: 6, count: 15 }, { cost: 5, count: 14 },
      { cost: 4, count: 18 }, { cost: 3, count: 16 }, { cost: 2, count: 14 }, { cost: 1, count: 12 }
    ];
    const MAX_Y = 20;
    const W = 340;
    const H = 48;

    const svg = document.getElementById('sparkSvg');
    const slider = document.getElementById('draftSlider');
    const simLabel = document.getElementById('simLabel');
    const subStats = document.getElementById('subStats');
    const avgCostText = document.getElementById('avgCostText');
    const boardPreview = document.getElementById('boardPreview');

    function toPoints(arr) {
      return arr.map((val, i) => {
        const x = (i / (arr.length - 1)) * W;
        const y = H - (val / MAX_Y) * H;
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      }).join(' ');
    }

    function render(pct) {
      let totalLeft = 0;
      let totalInit = 0;
      let weightedSum = 0;

      const currentCounts = INITIAL_COUNTS.map((t) => {
        totalInit += t.count;
        // High-cost Pokémon erode faster early in the draft
        const speed = 0.55 + Math.pow(t.cost / 20, 1.4) * 1.15;
        const remaining = Math.max(0, Math.round(t.count * (1 - (pct / 100) * speed)));
        totalLeft += remaining;
        weightedSum += remaining * t.cost;
        return remaining;
      });

      const initPts = toPoints(INITIAL_COUNTS.map(t => t.count));
      const currPts = toPoints(currentCounts);
      const initArea = `0,${H} ${initPts} ${W},${H}`;
      const currArea = `0,${H} ${currPts} ${W},${H}`;

      const avgCost = totalLeft > 0 ? weightedSum / totalLeft : 0;
      // Map avgCost (20 -> 0, 1 -> W)
      const avgX = ((20 - avgCost) / 19) * W;

      svg.innerHTML = `
        <defs>
          <linearGradient id="liveGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#9b84f7" stop-opacity="0.65"/>
            <stop offset="100%" stop-color="#7761d9" stop-opacity="0.1"/>
          </linearGradient>
        </defs>
        <!-- Eroded / Drafted gap fill -->
        <polygon points="${initArea}" fill="rgba(255,255,255,0.03)" />
        <!-- Initial Roof Dashed Line -->
        <polyline points="${initPts}" fill="none" stroke="#696380" stroke-width="1.5" stroke-dasharray="3,3" />
        <!-- Live Remaining Waterline Area -->
        <polygon points="${currArea}" fill="url(#liveGrad)" />
        <polyline points="${currPts}" fill="none" stroke="#b5a4ff" stroke-width="2.2" />
        <!-- Average Cost Marker -->
        <line x1="${avgX}" y1="0" x2="${avgX}" y2="${H}" stroke="#5ec294" stroke-width="1.5" stroke-dasharray="2,2" />
        <circle cx="${avgX}" cy="${H}" r="3.5" fill="#5ec294" />
        <!-- X Axis Labels -->
        <text x="0" y="57" fill="#85889b" font-size="9" font-weight="600">20pt (Apex)</text>
        <text x="${W/2 - 14}" y="57" fill="#85889b" font-size="9">10pt</text>
        <text x="${W - 42}" y="57" fill="#85889b" font-size="9" font-weight="600">1pt (Budget)</text>
      `;

      simLabel.textContent = `Draft ${pct}% Complete`;
      subStats.textContent = `${totalLeft} of ${totalInit} Pokémon remaining in pool`;
      avgCostText.textContent = `Avg Left: ${avgCost.toFixed(1)} pts`;

      // Show sample tier cards below
      boardPreview.innerHTML = INITIAL_COUNTS.slice(0, 6).map((t, i) => `
        <div class="preview-col">
          <strong>${t.cost} pts Tier</strong>
          <div class="bar-meter"><span style="width:${(currentCounts[i]/t.count)*100}%"></span></div>
          <span style="color:#85889b">${currentCounts[i]} / ${t.count} left</span>
        </div>
      `).join('');
    }

    slider.addEventListener('input', (e) => render(Number(e.target.value)));
    render(35);
  </script>
</body>
</html>
